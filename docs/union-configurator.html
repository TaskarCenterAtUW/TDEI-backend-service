<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Union 5.0 Configurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700&display=swap">
<style>
/* Layout: TDEI portal look — purple top bar, lavender page, one white card per question; before → after examples drive every choice. Light-only by design, matching the portal. */
:root{
  --brand:#32006e; --brand-2:#4b2e83; --ink:#162848; --text:#212529; --muted:#5f647a;
  --ds1:#586ab5; --ds2:#479fa1; --made:#7a2bd6; --gone:#a7abba;
  --page:#f4f0fb; --soft:#ebe4f6; --line:#ddd2ee; --white:#fff; --ok:#1d7a55; --off:#8a8fa3;
  --f-body:"Open Sans",sans-serif;          /* portal --primary-font-family */
  --f-head:"Open Sans",sans-serif;          /* the portal sets headings in Open Sans too */
  --f-alt:"Montserrat",sans-serif;          /* portal --secondary-font-family */
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{color:var(--text);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar{background:var(--brand);color:var(--white);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font:700 15px var(--f-alt);letter-spacing:.06em;background:var(--white);color:var(--brand);border-radius:4px;padding:4px 8px}
.bar h1{font:700 17px var(--f-head);margin:0}
.bar small{opacity:.8;font-size:13px}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h2,h3{font-family:var(--f-head);color:var(--ink);margin:0;text-wrap:balance}
h2{font-size:clamp(21px,2.6vw,27px);font-weight:700;line-height:1.25}
h3{font-size:15px;font-weight:700}
p{margin:0}

.card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:20px}
.eyebrow{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}
.lead{font-size:16px;color:var(--muted);max-width:66ch}

/* examples */
.ex-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.examples{display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:120px minmax(0,1fr) 22px minmax(0,1fr) 150px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ex .lbl{font:600 13.5px var(--f-body);color:var(--ink)}
.ex .lbl small{display:block;font-weight:400;color:var(--muted)}
.ex svg{width:100%;height:auto;display:block;background:#fbfaff;border-radius:4px}
.ex .arr{color:var(--muted);text-align:center;font-size:18px}
.cap{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.res{font:600 13.5px var(--f-body);display:flex;gap:6px;align-items:flex-start}
.res.y{color:var(--ok)}.res.n{color:var(--off)}
.res i{font-style:normal}
@media (max-width:760px){.ex{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr)}.ex .lbl,.ex .res{grid-column:1/-1}}

.cfg{display:flex;flex-direction:column;gap:6px}
pre{margin:0;font:12.5px/1.55 var(--f-mono);background:#f7f5fb;border:1px solid var(--line);border-radius:5px;padding:12px 14px;overflow:auto;color:var(--ink);white-space:pre;max-height:420px}
.nothing{font-size:13.5px;color:var(--muted);font-style:italic}
.note{font-size:13px;color:var(--muted);max-width:70ch}

/* buttons */
.ctl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 14px var(--f-body);border-radius:4px;padding:10px 18px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:var(--white)}
.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:var(--white);color:var(--brand)}
.btn.ghost:hover{background:var(--soft)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kerbopt{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink);cursor:pointer}
.kerbopt input{accent-color:var(--brand);width:15px;height:15px}
.kerbopt input:disabled+span{color:var(--off)}
.head{display:flex;flex-direction:column;gap:14px}
.head .top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start}
.head .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.head .lead{font-size:15px}
.status{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{display:inline-flex;align-items:center;gap:7px}
.stat b{color:var(--ink);font-weight:700}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.qa{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.qa button{border:0;background:none;color:var(--brand-2);font:600 13px var(--f-body);padding:4px 6px;border-radius:4px;cursor:pointer}
.qa button:hover{background:var(--soft);color:var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px;margin-top:-6px}
.toolbar .legend{font-size:12px}
.tright{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.tright .qa button{font-size:12.5px}
/* review */
.rgroup{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:5px;padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ghead:hover{background:var(--line)}
.ghead .chev{width:10px;height:10px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(45deg);margin:0 4px 4px 2px;flex:none}
.ghead[aria-expanded="false"] .chev{transform:rotate(-45deg);margin:0 4px 0 0}
@media (prefers-reduced-motion:no-preference){.ghead .chev{transition:transform .15s}}
.ghead h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-2)}
.ghead .gsum{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.gbody{display:flex;flex-direction:column;gap:8px}
.datasets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.dsf{display:flex;flex-direction:column;gap:6px;min-width:0}
.dsf .lbl{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);color:var(--ink)}
.dsf .lbl i{width:16px;height:4px;border-radius:2px;display:inline-block}
.dsf .anc{font:600 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--brand);background:var(--soft);border-radius:3px;padding:2px 6px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{font:14px var(--f-body);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px 9px 34px;background:var(--white);min-width:0;width:100%}
.search input:focus{border-color:var(--brand)}
.search input.bad{border-color:#c0392b}
.dsf .ak{font-size:12px;color:var(--muted)}
.dsf .ak.err{color:#a1251b}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--brand);border-color:var(--brand)}
.mini button{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--brand);font:600 12.5px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
.loadp{border:1px solid var(--brand);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fcfbfe}
.loadp textarea{font:12.5px/1.5 var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%;resize:vertical;color:var(--ink);background:var(--white)}
.lerr{color:#a1251b;font-size:13.5px}
.lwarn{background:#fff6e5;border:1px solid #f0d49b;border-radius:5px;padding:10px 12px;font-size:13px;color:#5c4100}
.lwarn ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.runbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(50,0,110,.08);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.runbar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.runbar .sum{font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.runbar .sum small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbar .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.item .row1{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 160px 84px;grid-template-areas:"n t v s";gap:12px;align-items:center}
.item .row1>.nmrow{grid-area:n}.item .row1>[id^="th-"]{grid-area:t;min-width:0}.item .row1>.chip{grid-area:v}.item .row1>[id^="sw-"]{grid-area:s}
.nmrow{display:flex;gap:6px;align-items:flex-start}
.item.detail{padding:14px 16px;gap:12px}
.item.detail .row1{grid-template-columns:minmax(0,1fr) 160px 84px;grid-template-areas:"n v s"}
.item.detail .nm{font-size:15px}
.item .examples{gap:8px}
@media (prefers-reduced-motion:no-preference){
  .item.detail .ex .aft svg{animation:reveal .5s ease-out both}
  .item.detail .ex:nth-child(2) .aft svg{animation-delay:.08s}.item.detail .ex:nth-child(3) .aft svg{animation-delay:.16s}
  .item.detail .ex .aft .nm,.item.detail .ex .aft .lm,.item.detail .ex .aft .ring{animation:pop .6s .25s ease-out both;transform-box:fill-box;transform-origin:center}
}
@keyframes reveal{from{opacity:.25}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
.info{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--brand);background:var(--white);color:var(--brand);font:700 12px/1 var(--f-alt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.info[aria-expanded="true"]{background:var(--brand);color:var(--white)}
.infobox{background:var(--soft);border-radius:5px;padding:10px 12px;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.infobox b{font-weight:600}
.fnote{font-size:12.5px;color:#5c4100;background:#fff6e5;border:1px solid #f0d49b;border-radius:4px;padding:6px 10px;margin:0}
.oswref{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);border-left:3px solid var(--brand-2);padding:2px 0 2px 10px}
.osw-tag{flex:none;font:700 10.5px var(--f-body);letter-spacing:.05em;color:var(--white);background:var(--brand-2);border-radius:3px;padding:2px 6px;margin-top:1px}
.num{display:flex;align-items:center;gap:6px}
.num input{width:72px;font:600 15px var(--f-alt);color:var(--brand);border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:var(--white);font-variant-numeric:tabular-nums}
.num input:disabled{color:var(--off);background:#f6f5f9}
.num span{font-size:13px;color:var(--muted)}
.icfg{border:1px solid var(--line);border-radius:5px}
.icfg summary{cursor:pointer;font:600 13px var(--f-body);color:var(--brand);padding:7px 10px;list-style-position:inside}
.icfg[open] summary{border-bottom:1px solid var(--line)}
.icfg .body{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.icfg pre{max-height:240px}
.btn.sm{padding:6px 12px;font-size:12.5px}
.item.isoff{background:#faf9fc}
.item .nm{font:600 14px var(--f-body);color:var(--ink)}
.item .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs.one{grid-template-columns:minmax(0,1fr)}
.thumb{display:flex;flex-direction:column;gap:2px;min-width:0}
.thumb svg{width:100%;height:auto;display:block;background:#fbfaff;border-radius:4px;border:1px solid var(--line)}
.thumb span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb span.y{color:var(--ok);font-weight:600}
.chip{display:inline-flex;flex-direction:column;gap:4px;align-items:flex-start}
.chip b{font:700 15px var(--f-alt);color:var(--brand);font-variant-numeric:tabular-nums}
.chip b.offv{color:var(--off)}
.pref{font:600 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:2px 6px}
.pref.rec{background:#e3f2ec;color:var(--ok)}
.pref.own{background:var(--soft);color:var(--brand-2)}
/* ── responsive ── */
[hidden]{display:none!important}
code{overflow-wrap:anywhere}
@media (max-width:860px){
  .item .row1{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n v s" "t t t"}
  .item.detail .row1{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n v s"}
}
@media (max-width:560px){
  .page{padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}
  .card{padding:16px 14px;gap:16px}
  .bar small{display:none}
  h2{font-size:22px}
  .head .top{flex-direction:column;align-items:stretch}
  .head .top .btn{align-self:flex-start}
  .status{flex-direction:column;align-items:flex-start;gap:8px}
  .qa{flex-wrap:wrap;margin-left:-6px}
  .toolbar{flex-direction:column;align-items:flex-start}
  .tright{width:100%;justify-content:space-between}
  .ghead{flex-wrap:wrap;row-gap:2px;padding:9px 10px}
  .ghead .gsum{margin-left:24px;width:100%;text-align:left}
  .item{padding:10px}
  .item .row1,.item.detail .row1{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n n" "t t" "v s";gap:10px}
  .item.detail .row1{grid-template-areas:"n n" "v s"}
  .chip{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .thumbs{gap:4px}
  .ex{grid-template-columns:minmax(0,1fr);gap:6px;padding:10px}
  .ex .arr{transform:rotate(90deg);line-height:1}
  .oswref{flex-direction:column;gap:4px}
  .runbar{padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
  .runbar-in{gap:8px}
  .runbar .sum{width:100%;font-size:13px}
  .runbar .acts{width:100%}
  .runbar .acts .btn{flex:1;padding:10px 8px}
  .runbar .acts .toast{order:3;width:100%}
}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:600 13px var(--f-body);color:var(--ink);border:0;background:none;padding:4px 0}
.sw .tr{width:38px;height:22px;border-radius:11px;background:#cfd2dd;position:relative;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"] .tr{background:var(--brand)}
.sw[aria-checked="true"] .tr::after{left:19px}
@media (prefers-reduced-motion:no-preference){.sw .tr,.sw .tr::after{transition:background .15s,left .15s}}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mini button{border:0;background:var(--white);color:var(--brand);font:600 12.5px var(--f-body);padding:5px 10px;cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--brand);color:var(--white)}
.dep{font-size:11.5px;color:var(--muted)}
.toast{font-size:13px;color:var(--ok);min-height:1.2em}

/* svg */
.l1{stroke:var(--ds1);stroke-width:4;fill:none;stroke-linecap:round}
.l2{stroke:var(--ds2);stroke-width:4;fill:none;stroke-linecap:round}
.lm{stroke:var(--made);stroke-width:4;fill:none;stroke-linecap:round}
.lg{stroke:var(--gone);stroke-width:3;fill:none;stroke-dasharray:4 5;stroke-linecap:round}
.stepsm{stroke:var(--white);stroke-width:4;stroke-dasharray:1.5 5;fill:none}
.zebra{stroke:var(--white);stroke-width:4;stroke-dasharray:3 4;fill:none}
.road{stroke-width:11;opacity:.55}
.ls{stroke-width:7;opacity:.75}
.n1{fill:var(--ds1)}.n2{fill:var(--ds2)}.nm{fill:var(--made)}
.ring{fill:none;stroke:var(--made);stroke-width:2.5}
.ghost{fill:none;stroke:var(--gone);stroke-width:1.5;stroke-dasharray:2 2}
.mv{stroke:var(--made);stroke-width:1.5;fill:none}
.dim{stroke:var(--muted);stroke-width:1}
.dt{fill:var(--muted);font:11px var(--f-body)}
.tick{stroke:var(--ink);stroke-width:2}
.p1{fill:var(--ds1);fill-opacity:.2;stroke:var(--ds1);stroke-width:2}
.p2{fill:var(--ds2);fill-opacity:.2;stroke:var(--ds2);stroke-width:2}
.pg{fill:none;stroke:var(--gone);stroke-width:2;stroke-dasharray:4 4}
.pm{fill:var(--made);fill-opacity:.15;stroke:var(--made);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){.ex svg .anim{transition:opacity .25s}}
</style>

<div class="bar"><div class="bar-in"><span class="mark">TDEI</span><h1>Dataset Union</h1><small>Union 5.0 configuration</small></div></div>
<div class="page"><div class="wrap">
  <main class="card" id="app"></main>
</div></div>
<div class="runbar" role="region" aria-label="Run the union"><div class="runbar-in">
  <div class="sum" id="barsum"></div>
  <div class="acts"><span class="toast" id="toast"></span><button class="btn ghost" id="copy">Copy configuration</button><button class="btn" id="run">Run union</button></div>
</div></div>

<script>
/* ═════════════ steps ═════════════ */
const GROUPS=[['start','Anchor dataset'],['join','Snap Nodes'],['dup','Remove duplicate Edges'],['link','Connect Edges'],['other','Adjacent entities & Zones']];
const R=0.5; // published default proximity
// Wording follows the OpenSidewalks Schema 0.3 (github.com/OpenSidewalks/OpenSidewalks-Schema, branch OSW0.3).
// `osw` is the schema rule or definition each case relates to; it is shown in the case's info panel.
const STEPS=[
 {id:'trust',g:'start',kind:'choice',name:'Anchor dataset',sub:'DS1 or DS2',
  title:'When both datasets describe the same entity, which dataset is the anchor?',
  lead:'Two OSW datasets often contain the same Nodes and Edges. Entities from the anchor dataset keep their geometry, _id and field values; the other dataset’s Nodes are snapped onto them and its duplicate Edges are removed.',
  osw:'Curb Nodes (barrier=kerb) are never moved, whichever dataset is the anchor: OSW maps a curb at the Edge endpoint where it physically is.'},
 {id:'s_sidewalk',g:'join',kind:'dist',draw:'ends',a:'sidewalk',fam:'sidewalk',name:'Sidewalk Nodes',sub:'highway=footway + footway=sidewalk',
  title:'Two Sidewalk Edges end close to each other. Snap their end Nodes into one Node?',
  lead:'Each dataset mapped the same Sidewalk centerline, but the end Nodes landed a little apart. Snapping makes them one Node, so the two Edges meet end-to-end and the network can be routed across both datasets.',

/* ═════════════ config (keys and ranges as content.union5_validate_config) ═════════════ */
// Rule names say what the rule does; they label the rule in the run report and in ext:union_rule tags.
const RULE={s_crossing:'snap_node_crossing',s_living:'snap_node_living_street',s_road:'snap_node_road',
  d_crossing:'dedup_edge_crossing',d_road:'dedup_edge_road',
  c_road:'connect_crossing_road',c_sidewalk:'connect_crossing_sidewalk',c_living:'connect_crossing_living_street'};
/* The Footway family (OSW 0.3): Sidewalk, Footway (plain), Pedestrian Road, Steps.
   Each has its own case on screen. In the configuration, types set to the same value share one rule.
   Sidewalk, Pedestrian Road and Steps have exact matches; plain Footway does not (union 5.0 has no
   "highway=footway with no footway=* subtag" match), so the rule that includes Footway uses the union's
   built-in type `pedestrian` (Footway, Sidewalk, Pedestrian Road, Steps; never Crossings) and is listed last.
   Earlier rules take their own types first. A type that is off is kept out of that last rule by a "keep" rule
   (snap and dedup only; connect has no such rule, see famNote). */
const FAM=['sidewalk','footway','pedroad','steps'];
const FAMTOK={sidewalk:'sidewalk',footway:'footway',pedroad:'pedestrian_road',steps:'steps'};
const FAMLBL={sidewalk:'Sidewalk',footway:'Footway',pedroad:'Pedestrian Road',steps:'Steps'};
const FAMSPEC={sidewalk:'sidewalk',pedroad:{highway:'pedestrian'},steps:{highway:'steps'}};
const FAMID={snap:t=>'s_'+t, dedup:t=>'d_'+t, connect:t=>'c_t_'+t};
const NEVER={highway:'none'};               // matches no OSW Edge: a dedup rule with this "to" never removes anything
let OWNER={};                               // case id -> {rule, keep} for the last configuration built
function famRules(stage,a){
  const v=t=>+a[FAMID[stage](t)]||0, pre={snap:'snap_node_',dedup:'dedup_edge_',connect:'connect_tjunction_'}[stage];
  const groups=[]; FAM.forEach(t=>{ if(v(t)>0){ const g=groups.find(x=>x.val===v(t)); g? g.types.push(t) : groups.push({val:v(t),types:[t]}); } });
  const out=[], fwg=groups.find(g=>g.types.includes('footway'));
  const mk=(types,spec,val)=>{ const name=pre+types.map(t=>FAMTOK[t]).join('_');
    const r= stage==='snap'?{name,type:spec,proximity:val}: stage==='dedup'?{name,from:spec,to:spec,proximity:val}:{name,from:spec,to:'pedestrian',operation:'geometry',proximity:val};
    types.forEach(t=>OWNER[FAMID[stage](t)]={rule:r}); return r; };
  const exact=types=> types.length===1? FAMSPEC[types[0]] : types.map(t=>FAMSPEC[t]);
  groups.filter(g=>g!==fwg).forEach(g=>out.push(mk(g.types,exact(g.types),g.val)));
  if(fwg){
    if(stage!=='connect') FAM.filter(t=>t!=='footway'&&!(v(t)>0)).forEach(t=>{
      const r= stage==='snap'? {name:'keep_node_'+FAMTOK[t],type:FAMSPEC[t],proximity:0} : {name:'keep_edge_'+FAMTOK[t],from:FAMSPEC[t],to:NEVER,proximity:0.1};
      OWNER[FAMID[stage](t)]={rule:r,keep:true}; out.push(r); });
    out.push(mk(fwg.types,'pedestrian',fwg.val));
  }
  return out;
}
// Connect has no "keep" rule: a Footway T-junction rule also reaches Sidewalk, Pedestrian Road and Steps ends
// whose own T-junction value is smaller (or off). Shown on the Footway T-junction line.
function famNote(id){
  if(id!=='c_t_footway' || !(A.c_t_footway>0)) return '';
  const extra=FAM.filter(t=>t!=='footway' && !((+A['c_t_'+t]||0)>=A.c_t_footway)).map(t=>FAMLBL[t]);
  return extra.length? `Union 5.0 has no Footway-only match for connections, so this also connects ${extra.join(', ')} ends up to ${(+A.c_t_footway).toFixed(1)} m.` : '';
}
function buildConfig(a=A){
  OWNER={};
  const c={}, anch= a.trust==='ds2'?{anchor:'ds2'}:{};
  const sr=[];
  if(a.s_crossing>0) sr.push((OWNER.s_crossing={rule:{name:RULE.s_crossing,type:'crossing',proximity:a.s_crossing}}).rule);
  sr.push(...famRules('snap',a));
  if(a.s_living>0) sr.push((OWNER.s_living={rule:{name:RULE.s_living,type:'living_street',proximity:a.s_living}}).rule);
  if(a.s_road>0) sr.push((OWNER.s_road={rule:{name:RULE.s_road,type:'road',proximity:a.s_road}}).rule);
  if(sr.some(r=>!r.name.startsWith('keep_'))||a.s_same){ c.snap=Object.assign({mode:'custom'},anch); if(a.s_same) c.snap.coincident=true; c.snap.rules=sr; }
  const dr=[];
  if(a.d_crossing>0) dr.push((OWNER.d_crossing={rule:{name:RULE.d_crossing,from:'crossing',to:'crossing',proximity:a.d_crossing}}).rule);
  dr.push(...famRules('dedup',a));
  if(a.d_road>0) dr.push((OWNER.d_road={rule:{name:RULE.d_road,from:'road',to:'road',proximity:a.d_road}}).rule);
  if(dr.some(r=>!r.name.startsWith('keep_'))){ c.dedup=Object.assign({mode:'custom'},a.d_overlap!==0.8?{min_overlap:a.d_overlap}:{},anch,{rules:dr}); }
  const cr=[];
  if(a.c_road>0) cr.push((OWNER.c_road={rule:{name:RULE.c_road,from:'crossing',to:'road',operation:'point',proximity:a.c_road}}).rule);
  if(a.c_sidewalk>0){ const r={name:RULE.c_sidewalk,from:'crossing',to:'sidewalk',operation:'geometry',proximity:a.c_sidewalk}; if(a.kerb) r.tags={barrier:'kerb',kerb:'lowered'}; OWNER.c_sidewalk={rule:r}; cr.push(r); }
  if(a.c_living>0) cr.push((OWNER.c_living={rule:{name:RULE.c_living,from:'crossing',to:'living_street',operation:'geometry',proximity:a.c_living}}).rule);
  cr.push(...famRules('connect',a));
  if(cr.length) c.connect={mode:'custom',rules:cr};
  if(a.x_points>0){ c.extensions={mode:'default',proximity:a.x_points}; if(a.x_build!==0.7){c.extensions.polygon_overlap=a.x_build;c.extensions.zone_overlap=a.x_build;} }
  return c;
}
function stepConfig(s){
  const c=buildConfig();
  const stage={s:'snap',d:'dedup',c:'connect'}[s.id[0]];
  const o=OWNER[s.id]; if(o && c[stage]) return {[stage]:{rules:['…',o.rule]}};
  switch(s.id){
    case 'trust': return {snap:{anchor:A.trust},dedup:{anchor:A.trust}};
    case 's_same': return A.s_same?{snap:{coincident:true}}:null;
    case 'd_overlap': return c.dedup?{dedup:{min_overlap:A.d_overlap}}:null;
    case 'x_points': return c.extensions?{extensions:{mode:'default',proximity:A.x_points}}:null;
    case 'x_build': return c.extensions?{extensions:{polygon_overlap:A.x_build,zone_overlap:A.x_build}}:null;
  }
  return null;
}

const gapLabel=(x1,x2,y,t)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="dim"/><line x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}" class="dim"/><line x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}" class="dim"/><text x="${(x1+x2)/2}" y="${y+14}" text-anchor="middle" class="dt">${t}</text>`;

function drawEnds(s,d,after,yes){

function drawSame(s,after,yes){

function drawDup(s,d,after,yes){
  const k=s.a, ys=k==='road'?9:13, y1=50, y2=50-d*ys, t=trusted();

function drawOverlap(s,share,after,yes){
  const L=170, x0=20, y1=46, y2=36, x2=x0+(1-share)*L, t=trusted(), gone=after&&yes;
  return (gone&&t===2?seg(x0,y1,x0+L,y1,'g','sidewalk'):seg(x0,y1,x0+L,y1,1,'sidewalk'))

function drawRoad(s,d,after,yes){

function drawPoints(s,d,after,yes){

/* example outcome for the current answer */
function outcome(s,e){
  const v=A[s.id];
  if(s.kind==='pct'){
    if(s.id==='d_overlap'){ const any=dedupOn(); if(!any) return {yes:false,text:'Not used: no duplicate Edges are removed',na:true}; const y=e>=v-1e-9; return {yes:y,text:y?'Duplicate edge removed':'Both edges kept'}; }
    if(!(A.x_points>0)) return {yes:false,text:'Not used: extension features are kept as they are',na:true};
    const y=e>=v-1e-9; return {yes:true,keep:y,text:y?'One Building polygon kept':'Merged into one polygon'};
  }
  if(s.kind==='yesno') return {yes:!!v,text:v?'Merged into one node':'Left as two nodes'};
  if(!(v>0)) return {yes:false,text:'Left as mapped'};
  if(s.draw==='road' && e==='x') return {yes:true,text:'New node added'};
  const y=e<=v+1e-9;
  const words={ends:['Snapped into one node','Left as two nodes'],dup:['Duplicate edge removed','Both edges kept'],tee:['Connected','Not connected'],road:['Connected to the Street','Not connected'],points:['One Bench kept','Both kept']}[s.draw];
  return {yes:y,text:y?words[0]:words[1]};
}
function draw(s,e,after){
  const o=outcome(s,e), yes=o.yes;
  switch(s.draw){
    case 'ends': return drawEnds(s,e,after,yes);
    case 'same': return drawSame(s,after,yes);
    case 'dup': return drawDup(s,e,after,yes);
    case 'overlap': return drawOverlap(s,e,after,yes&&!o.na);
    case 'tee': return drawTee(s,e,after,yes);
    case 'road': return drawRoad(s,e,after,yes);
    case 'points': return drawPoints(s,e,after,yes);
    case 'build': return drawBuild(s,e,after&&!o.na,true,A[s.id]);
  }
}
function exLabel(s,e){
  if(s.draw==='same') return ['Same coordinate','Footway meets Crossing at the curb'];
  if(s.draw==='overlap') return [`${Math.round(e*100)} % alongside`, e===1?'a full duplicate':e>0.8?'mostly a duplicate':'half a duplicate'];
  if(s.draw==='build') return [`${Math.round(e*100)} % overlap`, e>0.9?'nearly identical':e>0.6?'roughly the same':'only half overlaps'];
  if(s.draw==='road' && e==='x') return ['Crosses the Street','no shared node'];
  if(s.draw==='tee' && e===0) return ['Ends on the edge','touching, no shared node'];
  const n={ends:'apart',dup:'apart',tee:'gap',road:'gap',points:'apart'}[s.draw];
  return [m(e)+' '+n, s.draw==='road'?'stops short of the Street':s.draw==='tee'?'end node short of the edge':''];
}

// Reads a union 5.0 config (or a whole union request body with a "config" key) and maps it onto the
// cases on this page. Anything the page has no case for is listed so nothing is dropped silently.
function readConfig(text){
  let j; try{ j=JSON.parse(text); }catch(e){ return {error:'This is not valid JSON. Paste the configuration exactly as it was copied.'}; }
  if(j && typeof j==='object' && !Array.isArray(j) && j.config && typeof j.config==='object') j=j.config;
  if(!j || typeof j!=='object' || Array.isArray(j)) return {error:'Expected a configuration object such as {"snap": {...}, "connect": {...}}.'};
  const known=['snap','dedup','connect','extensions'], extra=Object.keys(j).filter(k=>!known.includes(k));
  if(extra.length) return {error:`Unknown section${extra.length>1?'s':''} ${extra.map(k=>`“${k}”`).join(', ')}. A union 5.0 configuration only has snap, dedup, connect and extensions.`};
  const a=offState(), notes=[], dist=(v,where)=>{ const n=+v; if(!(n>=0)){ notes.push(`${where}: proximity “${v}” is not a number; turned off.`); return 0; } if(n>5){ notes.push(`${where}: ${n} m is above the 5 m limit; set to 5 m.`); return 5; } return Math.round(n*10)/10; };
  const stagePx=(st)=> st.proximity!=null? +st.proximity : 0.5;
  const isType=(t,name)=> t===name;
  const typeTxt=t=> typeof t==='string'? t : JSON.stringify(t);
  // Footway family: which OSW types a rule's type covers ('ALL' = the built-in pedestrian type: every type not taken by an earlier rule)
  const famOf=t=>{ if(t==='pedestrian') return 'ALL'; if(t==='sidewalk') return ['sidewalk'];
    if(t&&typeof t==='object'&&!Array.isArray(t)){ const k=Object.keys(t); if(k.length===1&&k[0]==='highway'){ const h=[].concat(t.highway); const m=h.map(x=>x==='pedestrian'?'pedroad':x==='steps'?'steps':x==='footway'?'footway':null); return m.includes(null)?null:m; } return null; }
    if(Array.isArray(t)){ let o=[]; for(const x of t){ const f=famOf(x); if(!f||f==='ALL') return null; o=o.concat(f); } return o; } return null; };
  const famSet=(claimed,f)=> f==='ALL'? FAM.filter(x=>!claimed.has(x)) : f.filter(x=>!claimed.has(x));
  const isNever=t=> JSON.stringify(t)===JSON.stringify(NEVER);
  let anchor=null; const setAnchor=(st,where)=>{ if(st.anchor){ if(anchor && anchor!==st.anchor) notes.push(`${where} uses anchor ${st.anchor} but another stage uses ${anchor}; this page uses one anchor for both, so ${anchor} is kept.`); else anchor=st.anchor; } };

  // snap
  const sn=j.snap;
  if(sn && sn.mode && sn.mode!=='off'){
    setAnchor(sn,'snap');
    if(sn.attributes==='anchor_only') notes.push('snap.attributes “anchor_only” is not offered here; attributes will be merged.');
    if(sn.mode==='default'){ const p=dist(stagePx(sn),'snap'); Object.assign(a,{s_crossing:p,s_living:p,s_road:p}); FAM.forEach(t=>a['s_'+t]=p); a.s_same= sn.coincident!==false;
      notes.push('snap default also snaps “other” edge types (Edges that are not Sidewalk, Footway, Pedestrian Road, Steps, Crossing, Living Street or motor vehicle road Edges); this page has no case for them, so they will no longer snap.'); }
    else {
      a.s_same= sn.coincident===true;
      if(sn.others!=null) notes.push(`snap.others (${sn.others} m) has no case here and will be dropped.`);
      const claimed=new Set();
      (sn.rules||[]).forEach((r,i)=>{ const w=`snap rule ${i+1}${r.name?` “${r.name}”`:''}`;
        if(r.anchor && r.anchor!==sn.anchor) notes.push(`${w}: its own anchor (${r.anchor}) is not offered here; the page anchor is used.`);
        const p= dist(r.proximity!=null?r.proximity:stagePx(sn), w);
        const f=famOf(r.type);
        if(f){ famSet(claimed,f).forEach(t=>{ a['s_'+t]=p; claimed.add(t); }); }
        else if(isType(r.type,'crossing')) a.s_crossing=p;
        else if(isType(r.type,'living_street')) a.s_living=p; else if(isType(r.type,'road')) a.s_road=p;
        else notes.push(`${w}: type ${typeTxt(r.type)} has no case here and will be dropped.`); });
    }
  }
  // dedup
  const dd=j.dedup;
  if(dd && dd.mode && dd.mode!=='off'){
    setAnchor(dd,'dedup');
    if(dd.min_overlap!=null) a.d_overlap=Math.min(1,Math.max(0.3,+dd.min_overlap));
    if(dd.mode==='default'){ const p=dist(stagePx(dd),'dedup'); Object.assign(a,{d_crossing:p,d_road:p}); FAM.forEach(t=>a['d_'+t]=p);
      notes.push('dedup default also removes duplicate Living Street and “other” Edges; this page has no case for those, so they will be kept.'); }
    else { const claimed=new Set(); (dd.rules||[]).forEach((r,i)=>{ const w=`dedup rule ${i+1}${r.name?` “${r.name}”`:''}`;
      const f=famOf(r.from);
      if(f && isNever(r.to)){ famSet(claimed,f).forEach(t=>{ a['d_'+t]=0; claimed.add(t); }); return; }
      if(r.min_overlap!=null && +r.min_overlap!==+a.d_overlap) notes.push(`${w}: its own overlap (${Math.round(r.min_overlap*100)} %) is replaced by the page’s single overlap setting.`);
      const p= dist(r.proximity!=null?r.proximity:stagePx(dd), w);
      const pair=`${typeTxt(r.from)}→${typeTxt(r.to)}`;
      if(f && famOf(r.to)){ famSet(claimed,f).forEach(t=>{ a['d_'+t]=p; claimed.add(t); }); }
      else if(pair==='crossing→crossing') a.d_crossing=p; else if(pair==='road→road') a.d_road=p;
      else notes.push(`${w}: ${typeTxt(r.from)} → ${typeTxt(r.to)} has no case here and will be dropped.`); }); }
  }
  // connect
  const cn=j.connect;
  if(cn && cn.mode && cn.mode!=='off'){
    if(cn.mode==='default'){ const p=dist(stagePx(cn),'connect'); Object.assign(a,{c_road:p,c_sidewalk:p,c_living:p}); FAM.forEach(t=>a['c_t_'+t]=p);
      notes.push('connect default also connects Living Street to Living Street and Crossing to Crossing; this page has no case for those, so they will not be connected.'); }
    else { const claimed=new Set(); (cn.rules||[]).forEach((r,i)=>{ const w=`connect rule ${i+1}${r.name?` “${r.name}”`:''}`;
      const p= dist(r.proximity!=null?r.proximity:stagePx(cn), w), key=`${typeTxt(r.from)}→${typeTxt(r.to)}:${r.operation}`;
      const tags=r.tags||{}, tagKeys=Object.keys(tags);
      if(key==='crossing→road:point') a.c_road=p;
      else if(key==='crossing→sidewalk:geometry'){ a.c_sidewalk=p; a.kerb= tags.barrier==='kerb'; }
      else if(key==='crossing→living_street:geometry') a.c_living=p;
      else if(r.operation==='geometry' && famOf(r.from) && famOf(r.to)) famSet(claimed,famOf(r.from)).forEach(t=>{ a['c_t_'+t]=p; claimed.add(t); });
      else { notes.push(`${w}: ${typeTxt(r.from)} → ${typeTxt(r.to)} (${r.operation}) has no case here and will be dropped.`); return; }
      const other=tagKeys.filter(k=>!(key.startsWith('crossing→sidewalk') && (k==='barrier'||k==='kerb')));
      if(other.length) notes.push(`${w}: tag${other.length>1?'s':''} ${other.join(', ')} ${other.length>1?'are':'is'} not offered here and will be dropped.`); }); }
  }
  // extensions
  const ex=j.extensions;
  if(ex && ex.mode==='default'){
    a.x_points= dist(ex.proximity!=null?ex.proximity:0.5,'extensions') || 0.1;
    if(ex.polygon_overlap!=null) a.x_build=Math.min(1,Math.max(0.3,+ex.polygon_overlap));
    if(ex.line_overlap!=null && +ex.line_overlap!==0.7) notes.push(`extensions.line_overlap (${Math.round(ex.line_overlap*100)} %) is not offered here; the union default (70 %) will be used.`);
    if(ex.zone_overlap!=null && ex.polygon_overlap!=null && +ex.zone_overlap!==+ex.polygon_overlap) notes.push('extensions.zone_overlap differs from polygon_overlap; this page uses one value for both (the polygon one).');
  }
  a.trust= anchor||'ds1';
  return {answers:a,notes};
}
function offState(){ const a=recAnswers(); STEPS.forEach(s=>{ if(s.kind==='dist') a[s.id]=0; if(s.kind==='yesno') a[s.id]=false; }); a.kerb=false; return a; }
function loadPanelHTML(){
  return `<div class="loadp" id="loadp" hidden><h3>Load an existing configuration</h3>
    <p class="note">Paste a union configuration, or a whole union request that contains one. Every case below is set from it.</p>
    <textarea id="loadtxt" rows="7" spellcheck="false" placeholder='{"snap": {"mode": "default", "proximity": 1}}' aria-label="Configuration to load"></textarea>
    <div id="loadmsg"></div>
    <div class="ctl-row"><button class="btn" id="loadgo">Load</button><button class="btn ghost" id="loadcancel">Cancel</button></div></div>`;
}
let pendingLoad=null;
function tryLoad(){
  const r=readConfig($('loadtxt').value), m=$('loadmsg');
  if(r.error){ pendingLoad=null; m.innerHTML=`<p class="lerr">${esc(r.error)}</p>`; return; }
  if(r.notes.length && !pendingLoad){ pendingLoad=r;
    m.innerHTML=`<div class="lwarn"><b>Some settings have no case on this page.</b> If you load it, they are left out of the configuration this page produces:<ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
    $('loadgo').textContent='Load anyway'; return; }
  A=Object.assign(r.answers,{_last:{}}); pendingLoad=null; render(); save(); flash('Configuration loaded');
}
function render(){ $('app').innerHTML=viewHTML(); $('barsum').innerHTML=barSum(); refreshDatasets(); }
const refreshLead=()=>{ const l=$('lead'); if(l) l.textContent=leadText(!Object.keys(buildConfig()).length); };

document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.num){ const st=STEPS.find(x=>x.id===d.num); let v=parseFloat(e.target.value); if(isNaN(v)) return;
    v= st.kind==='pct'? Math.min(100,Math.max(30,v))/100 : Math.min(5,Math.max(0,Math.round(v*10)/10));
    A[d.num]=v; refreshReview(d.num); refreshLead(); return; }
  if(d.kerb){ A.kerb=e.target.checked; refreshReview(); }
  if(d.ds){ ds[d.ds]=e.target.value; $('barsum').innerHTML=barSum(); refreshDatasets(); save();
    document.dispatchEvent(new CustomEvent('tdei-dataset-search',{detail:{dataset:d.ds==='one'?'DS1':'DS2',query:e.target.value}})); }
});
document.addEventListener('input',e=>{ if(e.target.id==='loadtxt' && pendingLoad){ pendingLoad=null; $('loadmsg').innerHTML=''; $('loadgo').textContent='Load'; } });
document.addEventListener('change',e=>{ const nid=e.target.dataset&&e.target.dataset.num; if(nid){ const st=STEPS.find(x=>x.id===nid); e.target.value= st.kind==='pct'?Math.round(A[nid]*100):(+A[nid]).toFixed(1); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='reset'){ A=Object.assign(recAnswers(),{trust:A.trust}); render(); save(); return flash('Recommended values restored'); }
  if(b.id==='alloff'){ A._last={}; STEPS.forEach(s=>{ if(s.kind==='dist'){ if(A[s.id]>0) A._last[s.id]=A[s.id]; A[s.id]=0; } if(s.kind==='yesno') A[s.id]=false; }); render(); save(); return flash('Everything turned off'); }
  if(b.id==='loadopen'){ const lp=$('loadp'); lp.hidden=!lp.hidden; if(!lp.hidden) $('loadtxt').focus(); return; }
  if(b.id==='loadcancel'){ $('loadp').hidden=true; $('loadtxt').value=''; $('loadmsg').innerHTML=''; pendingLoad=null; $('loadgo').textContent='Load'; return; }
  if(b.id==='loadgo') return tryLoad();
  if(b.dataset.grp){ const k=b.dataset.grp, open=b.getAttribute('aria-expanded')!=='true'; collapsed[k]=!open; b.setAttribute('aria-expanded',String(open)); $('gb-'+k).hidden=!open; save(); return; }
  if(b.id==='expall'||b.id==='colall'){ const c=b.id==='colall'; GROUPS.forEach(([k])=>collapsed[k]=c); render(); save(); return; }
  if(b.id==='run'){ if(b.disabled) return; document.dispatchEvent(new CustomEvent('tdei-union-run',{detail:{tdei_dataset_id_one:ds.one.trim(),tdei_dataset_id_two:ds.two.trim(),config:buildConfig()}})); return flash('Run is not connected yet'); }
  if(b.dataset.view){ view=b.dataset.view; render(); save(); return; }
  if(b.dataset.info){ const box=$('ib-'+b.dataset.info), open=box.hidden; box.hidden=!open; b.setAttribute('aria-expanded',String(open)); return; }
  if(b.dataset.copyitem){ const id=b.dataset.copyitem; return copy($('cf-'+id),'t-'+id); }
  if(b.dataset.qtrust){ A.trust=b.dataset.qtrust; refreshReview(); return; }
  if(b.dataset.sw){ const st=STEPS.find(x=>x.id===b.dataset.sw); A._last=A._last||{};
    if(st.kind==='yesno') A[st.id]=!A[st.id];
    else if(A[st.id]>0){ A._last[st.id]=A[st.id]; A[st.id]=0; }
    else A[st.id]=A._last[st.id]||st.rec;
    refreshReview(); refreshLead();
    const el=document.querySelector(`[data-sw="${st.id}"]`); if(el) el.focus({preventScroll:true}); return; }
  if(b.id==='copy') return copy($('full'));
});
function copy(el,tid){
  const done=()=>flash('Copied',tid), fallback=()=>{const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);flash('Selected — press Ctrl+C or Cmd+C',tid);};
  try{ navigator.clipboard.writeText(el.textContent).then(done,fallback); }catch(err){ fallback(); }
}
function flash(t,tid){ const el=$(tid||'toast'); if(!el) return; el.textContent=t; clearTimeout(flash.t); flash.t=setTimeout(()=>el.textContent='',2400); }

render();
</script>

</body></html>
